services:
  - type: web
    name: post-event-form
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PIN
        sync: false
      - key: REPORT_TOKEN
        sync: false
