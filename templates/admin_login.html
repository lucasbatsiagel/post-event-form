{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="card">
  <h2>Admin</h2>
  <p class="subtitle">Enter the admin PIN to manage events and view reports.</p>
  <form method="post">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="pin">PIN</label>
    <input type="password" name="pin" id="pin" inputmode="numeric" autofocus required>
    <button type="submit" class="btn btn-block">Log in</button>
  </form>
</div>
{% endblock %}
